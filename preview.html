<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800">
  <title>WaltyCal Preview</title>
  <style>
    body {
      background: #888;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    }

    .device-frame {
      background: #222;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    .screen {
      width: 800px;
      height: 480px;
      background: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 14px 16px 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .paw-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .header-range {
      font-size: 12px;
      color: #666;
    }

    /* ── 7-Column Day Grid ── */
    .day-columns {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0;
      overflow: hidden;
    }

    .day-col {
      display: flex;
      flex-direction: column;
      border-left: 1px solid #e0e0e0;
      overflow: hidden;
    }
    .day-col:last-child {
      border-right: 1px solid #e0e0e0;
    }
    .day-col.weekend {
      border-color: #eee;
    }
    .day-col.today {
      background: #000;
      color: #fff;
      border-color: #000;
    }
    .day-col.today + .day-col {
      border-left-color: #000;
    }

    /* Day header */
    .day-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 4px 5px;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
    }
    .day-col.today .day-header {
      border-bottom-color: #333;
    }
    .day-col.weekend .day-header {
      border-bottom-color: #eee;
    }
    .day-name {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      opacity: 0.55;
    }
    .day-col.today .day-name { opacity: 0.75; }
    .day-num {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.1;
      margin-top: 1px;
    }
    .day-col.weekend .day-name,
    .day-col.weekend .day-num {
      opacity: 0.35;
    }

    /* Events */
    .day-events {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow: hidden;
      padding: 4px 5px 4px;
    }

    .event-item {
      display: flex;
      flex-direction: column;
      padding: 3px 0;
      border-bottom: 1px solid #f0f0f0;
      overflow: hidden;
    }
    .event-item:last-child {
      border-bottom: none;
    }
    .day-col.today .event-item {
      border-bottom-color: #333;
    }

    .event-meta {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .ev-symbol {
      font-size: 8px;
      font-weight: 800;
      flex-shrink: 0;
      opacity: 0.6;
    }
    .day-col.today .ev-symbol { opacity: 0.75; }
    .ev-time {
      font-size: 9px;
      opacity: 0.6;
    }
    .day-col.today .ev-time { opacity: 0.8; }
    .ev-title {
      font-size: 10px;
      font-weight: 600;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }
    .day-col.today .ev-title {
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="device-frame">
    <div class="screen">

      <div class="header">
        <div class="header-left">
          <svg class="paw-icon" viewBox="0 0 100 100" fill="black" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="50" cy="62" rx="22" ry="18"/>
            <ellipse cx="26" cy="42" rx="9" ry="11"/>
            <ellipse cx="74" cy="42" rx="9" ry="11"/>
            <ellipse cx="38" cy="30" rx="8" ry="10"/>
            <ellipse cx="62" cy="30" rx="8" ry="10"/>
          </svg>
          <span class="header-title">WaltyCal</span>
        </div>
        <span class="header-range">Mar 24 – Mar 30</span>
      </div>

      <div class="day-columns">

        <!-- Monday -->
        <div class="day-col">
          <div class="day-header">
            <div class="day-name">Mon</div>
            <div class="day-num">24</div>
          </div>
          <div class="day-events">
            <div class="event-item">
              <div class="event-meta"><span class="ev-symbol">B</span><span class="ev-time">all day</span></div>
              <div class="ev-title">Staff Dev Day</div>
            </div>
          </div>
        </div>

        <!-- Tuesday -->
        <div class="day-col">
          <div class="day-header">
            <div class="day-name">Tue</div>
            <div class="day-num">25</div>
          </div>
          <div class="day-events">
            <div class="event-item">
              <div class="event-meta"><span class="ev-symbol">B</span><span class="ev-time">9am</span></div>
              <div class="ev-title">Team Standup</div>
            </div>
            <div class="event-item">
              <div class="event-meta"><span class="ev-symbol">G</span><span class="ev-time">2pm</span></div>
              <div class="ev-title">Dentist Appt</div>
            </div>
          </div>
        </div>

        <!-- Wednesday -->
        <div class="day-col">
          <div class="day-header">
            <div class="day-name">Wed</div>
            <div class="day-num">26</div>
          </div>
          <div class="day-events">
            <div class="event-item">
              <div class="event-meta"><span class="ev-symbol">G</span><span class="ev-time">7pm</span></div>
              <div class="ev-title">Dinner w/ Johnsons</div>
            </div>
          </div>
        </div>

        <!-- Thursday (Today) -->
        <div class="day-col today">
          <div class="day-header">
            <div class="day-name">Thu</div>
            <div class="day-num">27</div>
          </div>
          <div class="day-events">
            <div class="event-item">
              <div class="event-meta"><span class="ev-symbol">B</span><span class="ev-time">10am</span></div>
              <div class="ev-title">Quarterly Review</div>
            </div>
            <div class="event-item">
              <div class="event-meta"><span class="ev-symbol">G</span><span class="ev-time">6:30pm</span></div>
              <div class="ev-title">Soccer Practice</div>
            </div>
          </div>
        </div>

        <!-- Friday -->
        <div class="day-col">
          <div class="day-header">
            <div class="day-name">Fri</div>
            <div class="day-num">28</div>
          </div>
          <div class="day-events">
            <div class="event-item">
              <div class="event-meta"><span class="ev-symbol">B</span><span class="ev-time">12pm</span></div>
              <div class="ev-title">Lunch with Sarah</div>
            </div>
          </div>
        </div>

        <!-- Saturday -->
        <div class="day-col weekend">
          <div class="day-header">
            <div class="day-name">Sat</div>
            <div class="day-num">29</div>
          </div>
          <div class="day-events"></div>
        </div>

        <!-- Sunday -->
        <div class="day-col weekend">
          <div class="day-header">
            <div class="day-name">Sun</div>
            <div class="day-num">30</div>
          </div>
          <div class="day-events">
            <div class="event-item">
              <div class="event-meta"><span class="ev-symbol">B</span><span class="ev-time">all day</span></div>
              <div class="ev-title">Easter Sunday</div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>
</body>
</html>

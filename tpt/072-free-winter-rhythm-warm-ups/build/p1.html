</style></head><body><div class="sq"><div class="store">Hudson Beat</div><div class="hd" style="font-size:72px;margin-top:28px">What is inside</div><div class="sub" style="font-size:28px;margin-top:10px">Four warm-ups for grades 2–5</div><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding-bottom:70px"><div style="display:flex;gap:22px;align-items:flex-start"><div style="width:290px;display:flex;flex-direction:column;align-items:center"><div class="shot" style="width:290px"><img src="pg2.png"></div><div class="lbl" style="font-size:20px;margin-top:20px">Warm-up 1: ta and ti-ti</div><div style="font-family:Oswald;font-weight:300;font-size:20px;line-height:1.25;text-align:center;margin-top:8px;width:270px">Quarter notes and paired eighths, with winter words</div></div><div style="width:290px;display:flex;flex-direction:column;align-items:center"><div class="shot" style="width:290px"><img src="pg3.png"></div><div class="lbl" style="font-size:20px;margin-top:20px">Warm-up 2: quarter rests</div><div style="font-family:Oswald;font-weight:300;font-size:20px;line-height:1.25;text-align:center;margin-top:8px;width:270px">A silent beat: say shh</div></div><div style="width:290px;display:flex;flex-direction:column;align-items:center"><div class="shot" style="width:290px"><img src="pg4.png"></div><div class="lbl" style="font-size:20px;margin-top:20px">Warm-up 3: half and whole notes</div><div style="font-family:Oswald;font-weight:300;font-size:20px;line-height:1.25;text-align:center;margin-top:8px;width:270px">Hold the sound for 2 and 4 beats</div></div></div><div style="display:flex;gap:18px"><div class="pill">Clap</div><div class="pill">Say</div><div class="pill">Hold</div></div></div><div class="swm" style="font-size:230px">PREVIEW</div><div class="band">Free <em>·</em> Teacher led <em>·</em> 4/4 rhythms</div></div></body></html>
